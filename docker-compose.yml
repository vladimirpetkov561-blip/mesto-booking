services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mesto
      POSTGRES_PASSWORD: mesto_password
      POSTGRES_DB: mesto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mesto:mesto_password@db:5432/mesto
    depends_on:
      - db

volumes:
  postgres_data: